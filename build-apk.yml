            align-items:center;
            justify-content:center;
            padding:25px;
            text-align:center
          }

          .permission.show{
            display:flex
          }
          </style>
          </head>

          <body>

          <div id="permission" class="permission">
            <div>
              <div style="font-size:60px">🖼️</div>
              <h2>Přístup k celé galerii</h2>
              <p>FOTOBOX potřebuje přístup k fotografiím, aby mohl zobrazit a třídit celou galerii telefonu.</p>
              <button class="primary" onclick="Android.requestPermission()">Povolit fotografie</button>
              <p class="muted">Na Androidu 14+ zvol „Povolit všechny fotografie“.</p>
            </div>
          </div>

          <header class="top">
            <div class="brand">
              <div class="brandL">
                <div id="liveLogo" class="live">📷</div>
                <div>
                  <h1>FOTOBOX</h1>
                  <div class="sub">Celá galerie. Přehledně. Chytře.</div>
                </div>
              </div>
              <button class="gear" onclick="show('more')">⚙️</button>
            </div>

            <div class="searchrow">
              <input id="search" class="search" placeholder="Hledat v celé galerii..." onkeydown="if(event.key==='Enter')doSearch()">
              <button class="searchbtn" onclick="doSearch()">⌕</button>
            </div>
          </header>

          <section id="home" class="screen active">
            <div class="title">Chytré kategorie</div>
            <div id="smartCats" class="cards"></div>

            <div class="title">Poslední fotografie</div>
            <div id="recent" class="grid"></div>
          </section>

          <section id="gallery" class="screen">
            <div class="title">Všechny fotografie</div>
            <div id="galleryGrid" class="grid"></div>
            <button class="secondary" style="width:100%;margin-top:12px" onclick="loadMore()">Načíst další</button>
          </section>

          <section id="albums" class="screen">
            <div style="display:flex;justify-content:space-between;align-items:center">
              <div class="title">Alba</div>
              <button class="primary" onclick="newAlbum()">+ Nové album</button>
            </div>

            <div class="title" style="font-size:17px">Moje alba</div>
            <div id="customAlbums"></div>

            <div class="title" style="font-size:17px">Alba z telefonu</div>
            <div id="systemAlbums"></div>
          </section>

          <section id="more" class="screen">
            <div class="title">Více</div>

            <div class="row">
              🔐
              <div class="grow">
                <b>Originály zůstávají v telefonu</b>
                <div class="muted">FOTOBOX fotografie nekopíruje ani nepřesouvá.</div>
              </div>
            </div>

            <div class="row">
              🧠
              <div class="grow">
                <b>Dynamické kategorie</b>
                <div class="muted">Pořadí se mění podle toho, co nejčastěji hledáš.</div>
              </div>
            </div>
          </section>

          <nav class="nav">
            <button onclick="show('home')"><span>⌂</span>Domů</button>
            <button onclick="show('gallery')"><span>▦</span>Fotky</button>
            <button class="center" onclick="Android.openCamera()"><span>📷</span>Foťák</button>
            <button onclick="show('albums')"><span>▣</span>Alba</button>
            <button onclick="show('more')"><span>☰</span>Více</button>
          </nav>

          <div id="viewer" class="viewer">
            <div class="viewerTop">
              <button class="secondary" onclick="closeViewer()">←</button>
              <b id="viewerName">Fotografie</b>
              <button class="secondary" onclick="toggleFav(current.id)">♥</button>
            </div>

            <img id="viewerImg">

            <div class="viewerBtns">
              <button onclick="toggleFav(current.id)">❤️ Oblíbené</button>
              <button onclick="addCurrentToAlbum()">🗂 Přidat do alba</button>
              <button onclick="Android.openCamera()">📷 Foťák</button>
            </div>
          </div>

          <script>
          let all=[];
          let offset=0;
          let pageSize=180;
          let current=null;
          let buckets=[];

          const favs=
            new Set(
              JSON.parse(
                localStorage.getItem('favs')||'[]'
              )
            );

          let albums=
            JSON.parse(
              localStorage.getItem('albums')||'[]'
            );

          let stats=
            JSON.parse(
              localStorage.getItem('searchStats')||'{}'
            );

          function parse(s){
            try{return JSON.parse(s||'[]')}
            catch(e){return[]}
          }

          function saveState(){
            localStorage.setItem('favs',JSON.stringify([...favs]));
            localStorage.setItem('albums',JSON.stringify(albums));
            localStorage.setItem('searchStats',JSON.stringify(stats));
          }

          function onPermissionChanged(){
            const s=Android.permissionState();

            document
              .getElementById('permission')
              .classList
              .toggle('show',s==='none');

            if(s!=='none')
              refreshAll();
          }

          function photoHtml(p){
            return `
              <div class="photo" onclick="openViewer(${p.id})">
                <img loading="lazy" src="${p.thumb}">
                <button class="heart ${favs.has(p.id)?'on':''}" onclick="event.stopPropagation();toggleFav(${p.id})">♥</button>
              </div>`;
          }

          function show(id){
            document.querySelectorAll('.screen')
              .forEach(x=>x.classList.remove('active'));

            document
              .getElementById(id)
              .classList.add('active');

            if(id==='albums')
              renderAlbums();
          }

          function refreshAll(){
            offset=0;

            all=parse(
              Android.getPhotos(
                0,
                pageSize
              )
            );

            offset=all.length;

            document
              .getElementById('galleryGrid')
              .innerHTML=
                all.map(photoHtml).join('');

            buckets=parse(
              Android.getBuckets()
            );

            renderRecent();
            renderSmart();
            renderAlbums();
          }

          function loadMore(){
            const n=parse(
              Android.getPhotos(
                offset,
                pageSize
              )
            );

            offset+=n.length;
            all=all.concat(n);

            document
              .getElementById('galleryGrid')
              .insertAdjacentHTML(
                'beforeend',
                n.map(photoHtml).join('')
              );
          }

          function renderRecent(){
            document
              .getElementById('recent')
              .innerHTML=
                all
                .slice(0,18)
                .map(photoHtml)
                .join('');
          }

          function smartItems(){
            let out=
              Object.entries(stats)
              .sort((a,b)=>b[1]-a[1])
              .slice(0,4)
              .map(([name,count])=>({
                name,
                count,
                kind:'search'
              }));

            let used=
              new Set(
                out.map(
                  x=>x.name.toLowerCase()
                )
              );

            for(const b of buckets){
              if(out.length>=8)
                break;

              if(!used.has(b.name.toLowerCase())){
                out.push({
                  name:b.name,
                  count:b.count,
                  kind:'bucket'
                });

                used.add(
                  b.name.toLowerCase()
                );
              }
            }

            return out;
          }

          function renderSmart(){
            document
              .getElementById('smartCats')
              .innerHTML=
                smartItems()
                .map(x=>`
                  <div class="card" onclick="searchFor('${x.name.replace(/'/g,'')}')">
                    <div>🗂️</div>
                    <div>
                      <b>${x.name}</b>
                      <div class="muted">
                        ${x.kind==='search'?'často hledané':x.count+' fotek'}
                      </div>
                    </div>
                  </div>
                `)
                .join('');
          }

          function doSearch(){
            const q=
              document
              .getElementById('search')
              .value
              .trim();

            if(!q){
              show('gallery');
              return;
            }

            stats[q]=(stats[q]||0)+1;
            saveState();

            const r=parse(
              Android.searchPhotos(
                q,
                0,
                300
              )
            );

            show('gallery');

            document
              .getElementById('galleryGrid')
              .innerHTML=
                r.map(photoHtml).join('');
          }

          function searchFor(q){
            document
              .getElementById('search')
              .value=q;

            doSearch();
          }

          function openViewer(id){
            current=
              all.find(
                x=>x.id===id
              );

            if(!current)
              return;

            document
              .getElementById('viewerImg')
              .src=current.full;

            document
              .getElementById('viewerName')
              .textContent=
                current.name||'Fotografie';

            document
              .getElementById('viewer')
              .classList.add('show');
          }

          function closeViewer(){
            document
              .getElementById('viewer')
              .classList.remove('show');
          }

          function toggleFav(id){
            if(favs.has(id))
              favs.delete(id);
            else
              favs.add(id);

            saveState();
            refreshAll();
          }

          function newAlbum(){
            const name=
              prompt(
                'Název nového alba'
              );

            if(!name)
              return;

            albums.push({
              id:Date.now(),
              name,
              ids:[]
            });

            saveState();
            renderAlbums();
          }

          function addCurrentToAlbum(){
            if(!current)
              return;

            if(!albums.length){
              newAlbum();

              if(!albums.length)
                return;
            }

            const text=
              albums
              .map(
                (a,i)=>
                  `${i+1}. ${a.name}`
              )
              .join('\n');

            const n=
              parseInt(
                prompt(
                  'Vyber číslo alba:\n'+
                  text
                )
              );

            if(!n||!albums[n-1])
              return;

            const a=albums[n-1];

            if(!a.ids.includes(current.id))
              a.ids.push(current.id);

            saveState();
            renderAlbums();

            alert(
              'Přidáno do alba '+a.name
            );
          }

          function openCustomAlbum(id){
            const a=
              albums.find(
                x=>x.id===id
              );

            if(!a)
              return;

            show('gallery');

            const arr=
              all.filter(
                p=>a.ids.includes(p.id)
              );

            document
              .getElementById('galleryGrid')
              .innerHTML=
                arr.map(photoHtml).join('');
          }

          function renderAlbums(){
            document
              .getElementById('customAlbums')
              .innerHTML=
                albums
                .map(a=>`
                  <div class="row" onclick="openCustomAlbum(${a.id})">
                    📁
                    <div class="grow">
                      <b>${a.name}</b>
                      <div class="muted">${a.ids.length} fotografií</div>
                    </div>
                    ›
                  </div>
                `)
                .join('');

            document
              .getElementById('systemAlbums')
              .innerHTML=
                buckets
                .map(b=>`
                  <div class="row" onclick="searchFor('${b.name.replace(/'/g,'')}')">
                    📂
                    <div class="grow">
                      <b>${b.name}</b>
                      <div class="muted">${b.count} fotografií</div>
                    </div>
                    ›
                  </div>
                `)
                .join('');
          }

          function onNativeGalleryChanged(){
            setTimeout(
              refreshAll,
              500
            );
          }

          onPermissionChanged();
          </script>
          </body>
          </html>
          EOF

      - name: Build APK
        run: gradle assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: FOTOBOX-v4-APK
          path: app/build/outputs/apk/debug/app-debug.apk
