name: Build FOTOBOX v4 APK

on:
  workflow_dispatch:
  push:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
      - name: Install SDK
        run: sdkmanager "platforms;android-35" "build-tools;35.0.0"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Create FOTOBOX v4 project
        run: |
          rm -rf app settings.gradle build.gradle
          mkdir -p app/src/main/java/com/fotobox/app app/src/main/assets app/src/main/res/values app/src/main/res/mipmap-anydpi app/src/main/res/mipmap-anydpi-v26

          cat > settings.gradle <<'EOF'
          pluginManagement { repositories { google(); mavenCentral(); gradlePluginPortal() } }
          dependencyResolutionManagement { repositoriesMode.set(RepositoriesMode.FAIL_ON_PROJECT_REPOS); repositories { google(); mavenCentral() } }
          rootProject.name='FOTOBOX'
          include ':app'
          EOF

          cat > build.gradle <<'EOF'
          plugins { id 'com.android.application' version '8.7.3' apply false }
          EOF

          cat > app/build.gradle <<'EOF'
          plugins { id 'com.android.application' }
          android {
            namespace 'com.fotobox.app'
            compileSdk 35
            defaultConfig {
              applicationId 'com.fotobox.app'
              minSdk 26
              targetSdk 35
              versionCode 5
              versionName '0.5'
            }
          }
          EOF

          cat > app/src/main/res/values/colors.xml <<'EOF'
          <resources>
            <color name="fotobox_blue">#2389FF</color>
          </resources>
          EOF

          cat > app/src/main/res/values/styles.xml <<'EOF'
          <resources>
            <style name="AppTheme" parent="android:style/Theme.Material.NoActionBar">
              <item name="android:fontFamily">sans</item>
              <item name="android:colorAccent">#2389FF</item>
              <item name="android:statusBarColor">#07111C</item>
              <item name="android:navigationBarColor">#07111C</item>
              <item name="android:windowLightStatusBar">false</item>
            </style>
          </resources>
          EOF

          cat > app/src/main/res/mipmap-anydpi/ic_launcher.xml <<'EOF'
          <vector xmlns:android="http://schemas.android.com/apk/res/android"
              android:width="108dp"
              android:height="108dp"
              android:viewportWidth="108"
              android:viewportHeight="108">
            <path android:fillColor="#2389FF" android:pathData="M0,0H108V108H0Z"/>
            <path android:fillColor="#FFFFFF" android:pathData="M29,34H42L47,27H61L66,34H79C84,34 88,38 88,43V75C88,80 84,84 79,84H29C24,84 20,80 20,75V43C20,38 24,34 29,34Z"/>
            <path android:fillColor="#2389FF" android:pathData="M54,43A16,16 0,1 0,54 75A16,16 0,1 0,54 43"/>
            <path android:fillColor="#FFFFFF" android:pathData="M54,49A10,10 0,1 0,54 69A10,10 0,1 0,54 49"/>
          </vector>
          EOF

          cp app/src/main/res/mipmap-anydpi/ic_launcher.xml app/src/main/res/mipmap-anydpi-v26/ic_launcher_foreground.xml

          cat > app/src/main/res/mipmap-anydpi-v26/ic_launcher.xml <<'EOF'
          <adaptive-icon xmlns:android="http://schemas.android.com/apk/res/android">
            <background android:drawable="@color/fotobox_blue"/>
            <foreground android:drawable="@mipmap/ic_launcher_foreground"/>
          </adaptive-icon>
          EOF

          cat > app/src/main/AndroidManifest.xml <<'EOF'
          <?xml version="1.0" encoding="utf-8"?>
          <manifest xmlns:android="http://schemas.android.com/apk/res/android">
            <uses-permission android:name="android.permission.READ_MEDIA_IMAGES"/>
            <uses-permission android:name="android.permission.READ_MEDIA_VISUAL_USER_SELECTED"/>
            <uses-permission android:name="android.permission.READ_EXTERNAL_STORAGE" android:maxSdkVersion="32"/>

            <queries>
              <intent>
                <action android:name="android.media.action.IMAGE_CAPTURE"/>
              </intent>
            </queries>

            <application
                android:label="FOTOBOX"
                android:icon="@mipmap/ic_launcher"
                android:roundIcon="@mipmap/ic_launcher"
                android:theme="@style/AppTheme">

              <activity
                  android:name=".MainActivity"
                  android:screenOrientation="portrait"
                  android:exported="true">

                <intent-filter>
                  <action android:name="android.intent.action.MAIN"/>
                  <category android:name="android.intent.category.LAUNCHER"/>
                </intent-filter>

              </activity>
            </application>
          </manifest>
          EOF

          cat > app/src/main/java/com/fotobox/app/MainActivity.java <<'EOF'
          package com.fotobox.app;

          import android.Manifest;
          import android.app.Activity;
          import android.os.*;
          import android.content.*;
          import android.content.pm.PackageManager;
          import android.database.Cursor;
          import android.graphics.*;
          import android.net.Uri;
          import android.provider.MediaStore;
          import android.provider.Settings;
          import android.view.*;
          import android.webkit.*;
          import android.widget.Toast;
          import org.json.*;
          import java.io.*;
          import java.util.*;

          public class MainActivity extends Activity {
            private static final int REQ_PERM=700, REQ_CAMERA=701;
            private WebView web;
            private Uri cameraUri;
            private int insetTop=0,insetBottom=0;

            @Override
            public void onCreate(Bundle b){
              super.onCreate(b);

              web=new WebView(this);
              setContentView(web);

              WebSettings s=web.getSettings();
              s.setJavaScriptEnabled(true);
              s.setDomStorageEnabled(true);
              s.setAllowFileAccess(true);
              s.setAllowContentAccess(true);

              web.addJavascriptInterface(new Bridge(),"Android");

              web.setWebViewClient(new WebViewClient(){
                @Override
                public WebResourceResponse shouldInterceptRequest(WebView v, WebResourceRequest r){
                  return mediaResponse(r.getUrl());
                }

                @Override
                public void onPageFinished(WebView v,String url){
                  pushInsets();
                  v.evaluateJavascript("window.onPermissionChanged&&onPermissionChanged()",null);
                }
              });

              if(Build.VERSION.SDK_INT>=21){
                web.setOnApplyWindowInsetsListener((v,i)->{
                  insetTop=i.getSystemWindowInsetTop();
                  insetBottom=i.getSystemWindowInsetBottom();
                  pushInsets();
                  return i;
                });
              }

              web.loadUrl("file:///android_asset/index.html");
            }

            private void pushInsets(){
              if(web==null)return;

              web.post(()->web.evaluateJavascript(
                "document.documentElement.style.setProperty('--android-top','"+insetTop+"px');"+
                "document.documentElement.style.setProperty('--android-bottom','"+insetBottom+"px')",
                null
              ));
            }

            private boolean fullPermission(){
              if(Build.VERSION.SDK_INT>=33)
                return checkSelfPermission(Manifest.permission.READ_MEDIA_IMAGES)==PackageManager.PERMISSION_GRANTED;

              return checkSelfPermission(Manifest.permission.READ_EXTERNAL_STORAGE)==PackageManager.PERMISSION_GRANTED;
            }

            private boolean partialPermission(){
              return Build.VERSION.SDK_INT>=34 &&
                  checkSelfPermission(Manifest.permission.READ_MEDIA_VISUAL_USER_SELECTED)==PackageManager.PERMISSION_GRANTED;
            }

            private void askPermission(){
              if(Build.VERSION.SDK_INT>=34){
                requestPermissions(
                  new String[]{
                    Manifest.permission.READ_MEDIA_IMAGES,
                    Manifest.permission.READ_MEDIA_VISUAL_USER_SELECTED
                  },
                  REQ_PERM
                );
              }else if(Build.VERSION.SDK_INT>=33){
                requestPermissions(
                  new String[]{Manifest.permission.READ_MEDIA_IMAGES},
                  REQ_PERM
                );
              }else{
                requestPermissions(
                  new String[]{Manifest.permission.READ_EXTERNAL_STORAGE},
                  REQ_PERM
                );
              }
            }

            @Override
            public void onRequestPermissionsResult(int r,String[] p,int[] g){
              super.onRequestPermissionsResult(r,p,g);

              if(r==REQ_PERM)
                web.evaluateJavascript("window.onPermissionChanged&&onPermissionChanged()",null);
            }

            private WebResourceResponse mediaResponse(Uri u){
              try{
                if(!"fotobox.local".equals(u.getHost()))return null;

                List<String> seg=u.getPathSegments();

                if(seg.size()<2)return null;

                long id=Long.parseLong(seg.get(1));

                Uri src=Uri.withAppendedPath(
                  MediaStore.Images.Media.EXTERNAL_CONTENT_URI,
                  String.valueOf(id)
                );

                if("thumb".equals(seg.get(0))){
                  Bitmap bm;

                  if(Build.VERSION.SDK_INT>=29){
                    bm=getContentResolver().loadThumbnail(
                      src,
                      new android.util.Size(480,480),
                      null
                    );
                  }else{
                    InputStream in=getContentResolver().openInputStream(src);
                    Bitmap raw=BitmapFactory.decodeStream(in);

                    if(in!=null)in.close();

                    int w=raw.getWidth();
                    int h=raw.getHeight();
                    int m=Math.max(w,h);

                    float k=Math.min(1f,480f/m);

                    bm=Bitmap.createScaledBitmap(
                      raw,
                      Math.max(1,(int)(w*k)),
                      Math.max(1,(int)(h*k)),
                      true
                    );
                  }

                  ByteArrayOutputStream out=new ByteArrayOutputStream();

                  bm.compress(
                    Bitmap.CompressFormat.JPEG,
                    82,
                    out
                  );

                  return new WebResourceResponse(
                    "image/jpeg",
                    null,
                    new ByteArrayInputStream(out.toByteArray())
                  );
                }

                InputStream in=getContentResolver().openInputStream(src);
                String type=getContentResolver().getType(src);

                return new WebResourceResponse(
                  type==null?"image/*":type,
                  null,
                  in
                );

              }catch(Exception e){
                return null;
              }
            }

            private JSONObject photo(Cursor c) throws Exception{
              JSONObject o=new JSONObject();

              long id=c.getLong(0);

              o.put("id",id);
              o.put("name",safe(c.getString(1)));
              o.put("taken",c.getLong(2));
              o.put("added",c.getLong(3));
              o.put("bucket",safe(c.getString(4)));
              o.put("w",c.getInt(5));
              o.put("h",c.getInt(6));
              o.put("thumb","https://fotobox.local/thumb/"+id);
              o.put("full","https://fotobox.local/full/"+id);

              return o;
            }

            private String safe(String s){
              return s==null?"":s;
            }

            private JSONArray page(int offset,int limit,String q){
              JSONArray a=new JSONArray();

              if(!(fullPermission()||partialPermission()))
                return a;

              String[] proj={
                MediaStore.Images.Media._ID,
                MediaStore.Images.Media.DISPLAY_NAME,
                MediaStore.Images.Media.DATE_TAKEN,
                MediaStore.Images.Media.DATE_ADDED,
                MediaStore.Images.Media.BUCKET_DISPLAY_NAME,
                MediaStore.Images.Media.WIDTH,
                MediaStore.Images.Media.HEIGHT
              };

              Bundle b=new Bundle();

              b.putStringArray(
                ContentResolver.QUERY_ARG_SORT_COLUMNS,
                new String[]{MediaStore.Images.Media.DATE_ADDED}
              );

              b.putInt(
                ContentResolver.QUERY_ARG_SORT_DIRECTION,
                ContentResolver.QUERY_SORT_DIRECTION_DESCENDING
              );

              b.putInt(ContentResolver.QUERY_ARG_LIMIT,limit);
              b.putInt(ContentResolver.QUERY_ARG_OFFSET,offset);

              if(q!=null&&!q.trim().isEmpty()){
                b.putString(
                  ContentResolver.QUERY_ARG_SQL_SELECTION,
                  "("+
                  MediaStore.Images.Media.DISPLAY_NAME+
                  " LIKE ? OR "+
                  MediaStore.Images.Media.BUCKET_DISPLAY_NAME+
                  " LIKE ?)"
                );

                String like="%"+q+"%";

                b.putStringArray(
                  ContentResolver.QUERY_ARG_SQL_SELECTION_ARGS,
                  new String[]{like,like}
                );
              }

              try(Cursor c=getContentResolver().query(
                MediaStore.Images.Media.EXTERNAL_CONTENT_URI,
                proj,
                b,
                null
              )){
                if(c!=null)
                  while(c.moveToNext())
                    a.put(photo(c));

              }catch(Exception ignored){}

              return a;
            }

            private JSONArray buckets(){
              JSONArray out=new JSONArray();

              if(!(fullPermission()||partialPermission()))
                return out;

              HashMap<String,Integer> m=new HashMap<>();

              String[] p={
                MediaStore.Images.Media.BUCKET_DISPLAY_NAME
              };

              try(Cursor c=getContentResolver().query(
                MediaStore.Images.Media.EXTERNAL_CONTENT_URI,
                p,
                null,
                null,
                null
              )){
                if(c!=null){
                  while(c.moveToNext()){
                    String n=safe(c.getString(0));

                    if(n.isEmpty())
                      n="Ostatní";

                    m.put(
                      n,
                      m.getOrDefault(n,0)+1
                    );
                  }
                }
              }catch(Exception ignored){}

              ArrayList<Map.Entry<String,Integer>> e=
                  new ArrayList<>(m.entrySet());

              e.sort((a,b)->b.getValue()-a.getValue());

              for(int i=0;i<Math.min(30,e.size());i++){
                JSONObject o=new JSONObject();

                try{
                  o.put("name",e.get(i).getKey());
                  o.put("count",e.get(i).getValue());
                  out.put(o);
                }catch(Exception ignored){}
              }

              return out;
            }

            private int count(){
              if(!(fullPermission()||partialPermission()))
                return 0;

              try(Cursor c=getContentResolver().query(
                MediaStore.Images.Media.EXTERNAL_CONTENT_URI,
                new String[]{MediaStore.Images.Media._ID},
                null,
                null,
                null
              )){
                return c==null?0:c.getCount();

              }catch(Exception e){
                return 0;
              }
            }

            private void openCamera(){
              runOnUiThread(()->{
                try{
                  ContentValues v=new ContentValues();

                  v.put(
                    MediaStore.Images.Media.DISPLAY_NAME,
                    "FOTOBOX_"+System.currentTimeMillis()+".jpg"
                  );

                  v.put(
                    MediaStore.Images.Media.MIME_TYPE,
                    "image/jpeg"
                  );

                  cameraUri=getContentResolver().insert(
                    MediaStore.Images.Media.EXTERNAL_CONTENT_URI,
                    v
                  );

                  Intent i=new Intent(
                    MediaStore.ACTION_IMAGE_CAPTURE
                  );

                  if(cameraUri!=null)
                    i.putExtra(
                      MediaStore.EXTRA_OUTPUT,
                      cameraUri
                    );

                  startActivityForResult(
                    i,
                    REQ_CAMERA
                  );

                }catch(Exception e){
                  Toast.makeText(
                    this,
                    "Fotoaparát se nepodařilo otevřít",
                    Toast.LENGTH_LONG
                  ).show();
                }
              });
            }

            @Override
            protected void onActivityResult(
              int r,
              int result,
              Intent data
            ){
              super.onActivityResult(r,result,data);

              if(r==REQ_CAMERA&&result==RESULT_OK)
                web.evaluateJavascript(
                  "window.onNativeGalleryChanged&&onNativeGalleryChanged()",
                  null
                );
            }

            public class Bridge{

              @JavascriptInterface
              public String permissionState(){
                return fullPermission()
                    ?"full"
                    :partialPermission()
                    ?"partial"
                    :"none";
              }

              @JavascriptInterface
              public void requestPermission(){
                runOnUiThread(()->askPermission());
              }

              @JavascriptInterface
              public void openSettings(){
                runOnUiThread(()->startActivity(
                  new Intent(
                    Settings.ACTION_APPLICATION_DETAILS_SETTINGS,
                    Uri.parse("package:"+getPackageName())
                  )
                ));
              }

              @JavascriptInterface
              public String getPhotos(int offset,int limit){
                return page(
                  offset,
                  Math.min(limit,300),
                  null
                ).toString();
              }

              @JavascriptInterface
              public String searchPhotos(
                String q,
                int offset,
                int limit
              ){
                return page(
                  offset,
                  Math.min(limit,300),
                  q
                ).toString();
              }

              @JavascriptInterface
              public String getBuckets(){
                return buckets().toString();
              }

              @JavascriptInterface
              public int getPhotoCount(){
                return count();
              }

              @JavascriptInterface
              public void openCamera(){
                MainActivity.this.openCamera();
              }
            }
          }
          EOF

          cat > app/src/main/assets/index.html <<'EOF'
          <!doctype html>
          <html lang="cs">
          <head>
          <meta charset="utf-8">
          <meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">

          <style>
          :root{
            --bg:#07111c;
            --panel:#102131;
            --panel2:#152b3d;
            --line:#294055;
            --blue:#2389ff;
            --muted:#91a7ba;
            --android-top:0px;
            --android-bottom:0px
          }

          *{box-sizing:border-box}

          body{
            margin:0;
            background:var(--bg);
            color:#fff;
            font-family:Arial,sans-serif;
            padding-bottom:calc(92px + var(--android-bottom))
          }

          .top{
            padding:calc(12px + var(--android-top)) 16px 10px;
            position:sticky;
            top:0;
            background:#07111cf2;
            backdrop-filter:blur(18px);
            z-index:20
          }

          .brand{
            display:flex;
            align-items:center;
            justify-content:space-between
          }

          .brandL{
            display:flex;
            gap:12px;
            align-items:center
          }

          .live{
            width:54px;
            height:54px;
            border-radius:16px;
            background:var(--blue);
            display:grid;
            place-items:center;
            overflow:hidden;
            font-size:25px
          }

          .live img{
            width:100%;
            height:100%;
            object-fit:cover
          }

          h1{
            font-size:26px;
            margin:0
          }

          .sub,.muted{
            color:var(--muted)
          }

          .sub{
            font-size:12px
