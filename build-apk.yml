          .gear{
            border:1px solid var(--line);
            background:var(--panel);
            color:#fff;
            width:44px;
            height:44px;
            border-radius:14px;
            font-size:20px
          }

          .searchrow{
            display:flex;
            gap:8px;
            margin-top:12px
          }

          .search{
            flex:1;
            border:1px solid var(--line);
